        </header>

        <main>
            <section class="input-section">
                <label for="inputIndonesia"><strong>Teks Bahasa Indonesia:</strong></label>
                <textarea id="inputIndonesia" placeholder="Masukkan kata atau kalimat dalam Bahasa Indonesia..."></textarea>

                <button id="btnTerjemah" onclick="prosesTerjemahan()">Terjemahkan</button>
            </section>

            <section class="output-section">
                <h2>Hasil Terjemahan</h2>
                <div id="outputContainer" class="output-grid">
                    <div class="card ngoko">
                        <h3>Ngoko Lugu</h3>
                        <div class="latin-result" id="outNgokoLatin">-</div>
                        <div class="jawa-result" id="outNgokoJawa"></div>
                    </div>

                    <div class="card ngoko-alus">
                        <h3>Ngoko Alus</h3>
                        <div class="latin-result" id="outNgokoAlusLatin">-</div>
                        <div class="jawa-result" id="outNgokoAlusJawa"></div>
                    </div>

                    <div class="card krama">
                        <h3>Krama Lugu</h3>
                        <div class="latin-result" id="outKramaLatin">-</div>
                        <div class="jawa-result" id="outKramaJawa"></div>
                    </div>

                    <div class="card krama-inggil">
                        <h3>Krama Inggil (Alus)</h3>
                        <div class="latin-result" id="outKramaInggilLatin">-</div>
                        <div class="jawa-result" id="outKramaInggilJawa"></div>
                    </div>

                    <div class="card bagongan">
                        <h3>Bagongan (Basa Kraton)</h3>
                        <div class="latin-result" id="outBagonganLatin">-</div>
                        <div class="jawa-result" id="outBagonganJawa"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="sriwedari.js"></script>
    <script src="app.js"></script>
